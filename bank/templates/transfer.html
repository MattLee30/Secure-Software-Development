{% extends "base.html" %}
{% block title %}Transfer — Secure Bank{% endblock %}
{% block content %}
  <h1>Transfer Funds</h1>

  <form method="POST" action="/transfer">
    <!-- CSRF token: Flask-WTF verifies this on submit; cross-site forms won't have it -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <label for="from">From account</label>
    <select id="from" name="from">
      {% for account in accounts %}
        <option value="{{ account }}">{{ account }}</option>
      {% endfor %}
    </select>

    <label for="to">To account</label>
    <input type="text" id="to" name="to" placeholder="Account number" />

    <label for="amount">Amount ($)</label>
    <input type="number" id="amount" name="amount" min="1" max="1000" />

    <input type="submit" value="Transfer" />
  </form>

  <a class="back-link" href="/dashboard">&larr; Back to Dashboard</a>
{% endblock %}
